name: DarkSource UE checks
on:
  push:
    branches: [main, ue-initial-build]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile darksource.py
      - run: python darksource.py --help
      - run: python -m pip install -r requirements.txt
      - run: python darksource.py --phone +14155552671
